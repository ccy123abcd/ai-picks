<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能选品器 | AI-PICKS</title>
<meta name="description" content="告诉我们你的需求，AI-PICKS 从248个真实测评产品中为你匹配最合适的。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#00ff41;font-family:'Courier New','Noto Sans SC',monospace;min-height:100vh;padding:2rem 1rem}
.wrap{max-width:800px;margin:0 auto}
h1{text-align:center;font-size:2rem;letter-spacing:.1em;margin-bottom:.5rem;text-shadow:0 0 15px #00ff41}
.sub{text-align:center;color:#1a7f37;margin-bottom:2rem}
.step{background:#0a0a0a;border:1px solid #1a3a1a;border-radius:10px;padding:1.5rem;margin-bottom:1.5rem}
.step h2{font-size:1.1rem;margin-bottom:1rem;color:#00ff41}
select,input[type=text]{width:100%;padding:.75rem;background:#111;border:1px solid #00ff41;color:#00ff41;border-radius:6px;font-family:inherit;font-size:1rem;margin-bottom:.5rem}
.btn{display:block;width:100%;padding:1rem;background:#00ff41;color:#000;font-weight:bold;font-size:1.1rem;border:none;border-radius:8px;cursor:pointer;font-family:inherit;margin-top:1rem}
.btn:hover{transform:scale(1.02)}
#results{margin-top:2rem}
.card{background:#0a0a0a;border:1px solid #00ff41;border-radius:10px;padding:1.5rem;margin-bottom:1rem}
.card h3{color:#fff;margin-bottom:.5rem}
.card .meta{color:#888;font-size:.85rem;margin-bottom:.75rem}
.card .why{color:#00ff41;font-size:.9rem;margin:.75rem 0;line-height:1.6}
.card .buy{margin-top:1rem}
.card .buy a{display:inline-block;padding:.5rem 1.5rem;border-radius:6px;text-decoration:none;font-weight:bold;margin-right:.5rem;min-width:120px;text-align:center}
.buy-amz{background:#00ff41;color:#000}
.buy-temu{background:#fb7701;color:#fff}
.buy-wm{background:#0071ce;color:#fff}
.back{display:block;text-align:center;margin-top:2rem;color:#1a7f37;text-decoration:none}
.score{float:right;color:#00ff41;font-weight:bold}
.lang{position:fixed;top:1rem;right:1rem;z-index:2}
.lang a{color:#1a7f37;text-decoration:none;padding:.4rem .8rem;border:1px solid #1a3a1a;border-radius:6px;font-size:.85rem;margin-left:.5rem}
.lang a.on{color:#00ff41;border-color:#00ff41}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K5C8NX3YJR"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-K5C8NX3YJR');</script>
</head>
<body>
<div class="lang"><a href="../finder.html">EN</a><a href="./finder.html" class="on">中文</a></div>
<div class="wrap">
<h1>◢ 智能选品器</h1>
<p class="sub">告诉我们你的需求，从248个真实测评产品中精准匹配。</p>

<div class="step">
<h2>1. 你在找什么？</h2>
<select id="cat"><option value="">-- 选择品类 --</option></select>
</div>

<div class="step">
<h2>2. 最高预算（可选）</h2>
<select id="budget">
<option value="0">不限</option>
<option value="50">$50 以内</option>
<option value="100">$100 以内</option>
<option value="200">$200 以内</option>
<option value="300">$300 以内</option>
<option value="500">$500 以内</option>
<option value="800">$800 以内</option>
<option value="1000">$1000 以内</option>
<option value="1500">$1500 以内</option>
</select>
</div>

<div class="step">
<h2>3. 关键词（可选）</h2>
<input type="text" id="kw" placeholder='比如：34寸，144Hz，无线，OLED…'>
<p style="color:#555;font-size:.8rem;margin-top:.25rem">用逗号分隔，我们会匹配规格和描述。</p>
</div>

<button class="btn" onclick="find()">🔍 查找我的产品</button>
<div id="results"></div>
<a class="back" href="./">← 返回首页</a>
</div>

<script>
let DB=[];
fetch('../finder-data.json').then(r=>r.json()).then(d=>{
  DB=d;
  const cats=[...new Set(d.map(p=>p.category))].sort();
  const sel=document.getElementById('cat');
  cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
});
function priceNum(s){const m=String(s).replace(/,/g,'').match(/[\d.]+/);return m?parseFloat(m[0]):99999;}
function find(){
  const cat=document.getElementById('cat').value;
  const budget=parseFloat(document.getElementById('budget').value);
  const kws=document.getElementById('kw').value.toLowerCase().split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  if(!cat){alert('请先选择品类');return;}
  let pool=DB.filter(p=>p.category===cat);
  if(budget>0) pool=pool.filter(p=>priceNum(p.price)<=budget);
  let scored=pool.map(p=>{
    let score=0,hits=[];
    const text=(p.name+' '+p.brand+' '+p.summary+' '+p.best_for+' '+JSON.stringify(p.specs)).toLowerCase();
    kws.forEach(kw=>{if(text.includes(kw)){score+=2;hits.push(kw);}
      const num=kw.match(/[\d.]+/);if(num&&text.includes(num[0])){score+=1;}});
    return {p,score,hits};
  });
  scored.sort((a,b)=>b.score-a.score);
  const top=scored.slice(0,5);
  const div=document.getElementById('results');
  if(!top.length){div.innerHTML='<p style="text-align:center;color:#888">没有匹配结果，试试放宽条件。</p>';return;}
  let html='<h2 style="margin-bottom:1rem">🎯 为你推荐：</h2>';
  top.forEach(({p,score,hits},i)=>{
    const q=encodeURIComponent(p.name.replace(/ /g,'+'));
    let buys=`<a class="buy-amz" href="${p.affiliate_link}" rel="nofollow sponsored noopener" target="_blank">Amazon</a>`;
    if(p.platforms.includes('temu')) buys+=`<a class="buy-temu" href="https://www.temu.com/search_result.html?search_key=${q}" rel="nofollow sponsored noopener" target="_blank">Temu</a>`;
    if(p.platforms.includes('walmart')) buys+=`<a class="buy-wm" href="https://www.walmart.com/search?q=${q}" rel="nofollow sponsored noopener" target="_blank">Walmart</a>`;
    const why=hits.length?`匹配你的关键词：<strong>${hits.join('、')}</strong><br>`:'';
    html+=`<div class="card"><span class="score">#${i+1}</span><h3>${p.name}</h3>
      <div class="meta">${p.brand} · ${p.price} · <a href="../human/${p.guide}.html" style="color:#1a7f37">完整指南 →</a></div>
      <div class="why">${why}${p.summary}</div><div class="buy">${buys}</div></div>`;
  });
  div.innerHTML=html;div.scrollIntoView({behavior:'smooth'});
}
localStorage.setItem('aipicks-lang','zh');
</script>
</body>
</html>
