<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#00ff41;font-family:'Courier New','Noto Sans SC',monospace;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
#rain{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:.35}

.lang select{background:#000;color:#00ff41;border:1px solid #00ff41;border-radius:6px;padding:.4rem .6rem;font-family:inherit;font-size:.85rem;cursor:pointer}

.portals{display:flex;gap:3rem;justify-content:center;flex-wrap:wrap}
.portal{width:280px;padding:2rem 1.25rem;border:2px solid;border-radius:12px;cursor:pointer;transition:all .3s;text-decoration:none;display:block}
.portal:hover{transform:scale(1.05)}
.portal.green{border-color:#00ff41;color:#00ff41;box-shadow:0 0 30px rgba(0,255,65,.3)}
.portal.green:hover{box-shadow:0 0 60px rgba(0,255,65,.6);background:rgba(0,255,65,.08)}
.portal.gold{border-color:#ffb62b;color:#ffb62b;box-shadow:0 0 30px rgba(255,182,43,.3)}
.portal.gold:hover{box-shadow:0 0 60px rgba(255,182,43,.6);background:rgba(255,182,43,.08)}
.portal .icon{font-size:3rem;margin-bottom:1rem}
.portal h2{font-size:1.3rem;margin-bottom:.5rem}
.portal p{font-size:.85rem;opacity:.8;line-height:1.8}
.badge{display:inline-block;font-size:.7rem;letter-spacing:.2em;border:1px solid currentColor;border-radius:4px;padding:.2rem .6rem;margin-bottom:.75rem;opacity:.9}
.footer{position:relative;z-index:1;margin-top:3rem;color:#00ff41;font-size:.9rem;line-height:2}
.footer a{color:#00ff41}
@media(max-width:600px){
.content{width:100%;padding-top:3.5rem}
h1{font-size:1.6rem;letter-spacing:.12em}
.slogan{font-size:1rem;margin-bottom:2rem}
.portals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
.portal{width:auto;min-width:0;overflow:hidden;padding:1.25rem .5rem}
.portal .icon{font-size:2.2rem;margin-bottom:.6rem}
.portal h2{font-size:1.05rem;overflow-wrap:break-word}
.portal p{font-size:.72rem;line-height:1.8;overflow-wrap:break-word}
.badge{font-size:.55rem;letter-spacing:.12em;white-space:nowrap}
.lang select{font-size:.75rem;padding:.3rem .5rem}
}

<script>
// 矩阵数字雨
const c=document.getElementById('rain'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
const chars='アイスクリーム0123456789ABCDEF$#@%&';
const fs=14,cols=Math.floor(c.width/fs),drops=Array(cols).fill(1);
function draw(){
x.fillStyle='rgba(0,0,0,.05)';x.fillRect(0,0,c.width,c.height);
x.fillStyle='#00ff41';x.font=fs+'px monospace';
for(let i=0;i<drops.length;i++){
const t=chars[Math.floor(Math.random()*chars.length)];
x.fillText(t,i*fs,drops[i]*fs);
if(drops[i]*fs>c.height&&Math.random()>.975)drops[i]=0;
drops[i]++;}
}
setInterval(draw,50);
addEventListener('resize',()=>{c.width=innerWidth;c.height=innerHeight});
localStorage.setItem('aipicks-lang','zh');
</script>
