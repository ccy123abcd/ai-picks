<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-PICKS | 真实测评聚合，为人类和AI而生</title>
<meta name="description" content="AI-PICKS：聚合 YouTube 真实测评，为人类和 AI 提供可信的产品推荐。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#00ff41;font-family:'Courier New','Noto Sans SC',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}
canvas{position:fixed;top:0;left:0;z-index:0}
.content{position:relative;z-index:1;text-align:center;padding:2rem;max-width:700px}
h1{font-size:3rem;letter-spacing:.2em;margin-bottom:.5rem;text-shadow:0 0 20px #00ff41;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 20px #00ff41}50%{text-shadow:0 0 40px #00ff41,0 0 60px #00ff41}}
.tagline{color:#1a7f37;font-size:1.1rem;margin-bottom:2rem;line-height:1.8}
.pills{display:flex;gap:2rem;justify-content:center;margin-bottom:2rem;flex-wrap:wrap}
.pill{width:160px;padding:2rem 1rem;border-radius:12px;text-decoration:none;font-weight:bold;font-size:1.2rem;transition:transform .2s;position:relative;z-index:1}
.pill:hover{transform:scale(1.08)}
.red{background:linear-gradient(135deg,#ff0040,#990026);color:#fff;box-shadow:0 0 30px #ff004055}
.blue{background:linear-gradient(135deg,#0080ff,#003d99);color:#fff;box-shadow:0 0 30px #0080ff55}
.pill small{display:block;font-size:.75rem;font-weight:normal;margin-top:.5rem;opacity:.8}
.finder-link{display:inline-block;margin-top:1rem;padding:.75rem 2rem;border:1px solid #00ff41;color:#00ff41;text-decoration:none;border-radius:8px;font-size:1rem;position:relative;z-index:1}
.finder-link:hover{background:#00ff4111}
.footer{margin-top:2rem;color:#1a7f37;font-size:.85rem;position:relative;z-index:1}
.lang{position:fixed;top:1rem;right:1rem;z-index:2}
.lang a{color:#1a7f37;text-decoration:none;padding:.4rem .8rem;border:1px solid #1a3a1a;border-radius:6px;font-size:.85rem;margin-left:.5rem}
.lang a.on{color:#00ff41;border-color:#00ff41}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="lang"><a href="../">EN</a><a href="./" class="on">中文</a></div>
<div class="content">
<h1>AI-PICKS</h1>
<p class="tagline">我们看遍数百个真实测评，所以你不用看。<br>We watch hundreds of reviews, so you don't have to.</p>
<div class="pills">
<a class="pill red" href="../human/">🔴 人类版<small>漂亮易读的购买指南</small></a>
<a class="pill blue" href="../ai/">🔵 AI 版<small>结构化数据，给 AI 读的</small></a>
</div>
<a class="finder-link" href="finder.html">🎯 智能选品器 — 告诉我你的需求</a>
<p class="footer">Wake up, Neo... The Matrix 有产品测评。</p>
</div>
<script>
// 矩阵雨
const c=document.getElementById('matrix'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
const cols=Math.floor(c.width/20),drops=Array(cols).fill(1);
const chars='アイカピックス01';
setInterval(()=>{x.fillStyle='rgba(0,0,0,.05)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#00ff41';x.font='15px monospace';
drops.forEach((y,i)=>{x.fillText(chars[Math.floor(Math.random()*chars.length)],i*20,y*20);if(y*20>c.height&&Math.random()>.975)drops[i]=0;drops[i]++;});},50);
// 记住语言选择
localStorage.setItem('aipicks-lang','zh');
</script>
</body>
</html>
